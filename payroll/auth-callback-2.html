<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening Dome Payroll</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2f6;color:#17324f;font:15px system-ui,sans-serif}.card{max-width:440px;margin:20px;padding:30px;background:white;border:1px solid #d8e0e8;border-radius:12px}h1{font-size:22px}#status{color:#526577}</style></head><body><main class="card"><h1>Dome Payroll</h1><div id="status" role="status" aria-live="polite">Opening your secure payroll session…</div></main><script>(()=>{const el=document.getElementById('status');const p=new URLSearchParams(location.hash.slice(1));if(p.has('error')){el.textContent=p.get('error_description')||p.get('error_code')||'The sign-in link was rejected. Request a new link.';return}const access=p.get('access_token'),refresh=p.get('refresh_token');if(!access||!refresh){el.textContent='This link did not include a sign-in session. Request a new link.';return}const flow=new URLSearchParams(location.search).get('flow')||String(Date.now());location.replace('/payroll/workspace.html?auth_version=20261110i-'+encodeURIComponent(flow)+'#access_token='+encodeURIComponent(access)+'&refresh_token='+encodeURIComponent(refresh))})();</script></body></html>
