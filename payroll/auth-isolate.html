<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dome Payroll Sign-in Test</title><style>body{font:15px system-ui;margin:2rem auto;max-width:700px;padding:1rem;color:#17324f}pre{white-space:pre-wrap;background:#eef3f8;padding:1rem;border-radius:8px}button{padding:.7rem 1rem}</style></head><body><h1>Dome Payroll sign-in check</h1><p>Temporary technical check. It uses the existing authorized email only and does not change payroll records.</p><button id="send">Send one fresh sign-in test</button><pre id="out">Loading Supabase browser client…</pre><script src="/payroll/supabase-browser.js?build=20261110h"></script><script>(async()=>{const out=document.getElementById('out');const write=s=>out.textContent=s;try{if(!window.supabase?.createClient)throw new Error('Supabase browser client missing: '+typeof window.supabase);const c=window.supabase.createClient('https://sazhdnqzaqpqcralmthh.supabase.co','sb_publishable_UicuMabi1dRKAvQ4YGiakg_NCMnftfS',{auth:{flowType:'implicit',detectSessionInUrl:false,persistSession:true,autoRefreshToken:true,storageKey:'dome-payroll-auth'}});const p=new URLSearchParams(location.hash.slice(1));if(p.has('error'))throw new Error('callback: '+(p.get('error_description')||p.get('error')));if(p.has('access_token')){write('URL contained auth tokens. Calling setSession…');const {data,error}=await c.auth.setSession({access_token:p.get('access_token'),refresh_token:p.get('refresh_token')});if(error)throw new Error('setSession: '+error.message);write('setSession OK for '+data.session.user.email+'; querying workspace…');history.replaceState({},document.title,location.pathname);const {data:rows,error:e}=await c.from('dome_payroll_workspaces').select('user_id,state').eq('user_id',data.session.user.id).maybeSingle();if(e)throw new Error('workspace query: '+e.code+' '+e.message);write('SUCCESS: session and workspace query passed. Workspace row: '+!!rows+'; employees: '+(rows?.state?.employees?.length??0));return}const {data:{session},error}=await c.auth.getSession();write('Ready. UMD loaded. Existing session: '+(session?.user?.email||'none')+'. Click button for isolated test link.')}catch(e){write('ERROR '+(e.stack||e.message||String(e)))} })();document.getElementById('send').onclick=async()=>{const out=document.getElementById('out');try{const r=await fetch('https://sazhdnqzaqpqcralmthh.supabase.co/auth/v1/otp?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',headers:{'apikey':'sb_publishable_UicuMabi1dRKAvQ4YGiakg_NCMnftfS','Content-Type':'application/json'},body:JSON.stringify({email:'priscillanarine@gmail.com',create_user:false})});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.message||JSON.stringify(d));out.textContent='Test link sent to your authorized email. I will verify it here.'}catch(e){out.textContent='Send failed: '+e.message}}</script></body></html>
