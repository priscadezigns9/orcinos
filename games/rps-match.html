<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a45"><title>RPS Match Arena</title><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#101a45;--blue:#1e40af;--gold:#f4c542;--red:#b8322c;--ink:#f8f4e8;--muted:#b9c8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Urbanist,sans-serif}.wrap{width:min(1080px,92%);margin:auto;padding:24px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:25px}.eyebrow{color:#93c5fd;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.room{color:var(--gold);font-weight:800;letter-spacing:3px}.btn,.pill{border:0;border-radius:12px;font:800 12px Urbanist;cursor:pointer}.pill{padding:10px 14px;background:#172554;border:1px solid rgba(147,197,253,.4);color:#dbeafe}.leave{background:var(--red);color:var(--ink)}.arena{background:#172554;border:1px solid rgba(147,197,253,.42);border-radius:32px;padding:34px 42px;box-shadow:0 30px 80px rgba(0,0,0,.3)}.arena-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(147,197,253,.2);padding-bottom:18px}.players{display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;gap:24px;margin:44px 0;text-align:center}.player{padding:26px 16px;border-radius:24px;background:#101a45;border:1px solid rgba(147,197,253,.3)}.avatar{font-size:42px}.player small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-top:8px}.player strong{display:block;font-size:22px;margin-top:6px}.score{font:60px 'DM Serif Display';color:var(--gold);margin-top:8px}.vs{display:grid;place-items:center;width:84px;height:84px;margin:auto;border-radius:50%;background:var(--red);border:2px solid var(--gold);font-weight:800}.status{text-align:center;min-height:28px;color:#dbeafe;font-size:16px;margin:20px 0}.moves{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}.move{width:170px;height:170px;border-radius:34px;border:2px solid rgba(147,197,253,.45);background:var(--blue);color:var(--ink);font-size:68px;cursor:pointer;box-shadow:0 12px 0 #172554;transition:.18s}.move:hover:not(:disabled){transform:translateY(-5px);border-color:var(--gold)}.move:disabled{opacity:.4;cursor:not-allowed}.move span{display:block;color:#dbeafe;font:800 13px Urbanist;letter-spacing:1px;text-transform:uppercase;margin-top:9px}.result{text-align:center;min-height:54px;color:var(--gold);font:46px 'DM Serif Display';margin-top:32px}.chat{position:fixed;right:22px;bottom:22px;width:min(350px,calc(100vw - 44px));background:#172554;border:1px solid rgba(147,197,253,.45);border-radius:22px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}.chat h3{font-size:12px;margin:0;color:var(--gold)}.messages{height:95px;overflow:auto;margin:10px 0;color:var(--muted);font-size:12px}.chatline{display:flex;gap:7px}.chatline input{min-width:0;flex:1;padding:10px;border:1px solid #4562a0;border-radius:9px;background:#101a45;color:var(--ink)}.chatline button{padding:10px 13px;background:var(--gold);color:#3b1b08;border-radius:9px}@media(max-width:700px){.wrap{width:94%;padding-top:16px}.arena{padding:20px 14px;border-radius:25px}.players{grid-template-columns:1fr 60px 1fr;gap:7px;margin:30px 0}.player{padding:18px 7px}.player strong{font-size:15px}.avatar{font-size:30px}.score{font-size:43px}.vs{width:58px;height:58px;font-size:11px}.move{width:100px;height:100px;border-radius:22px;font-size:38px}.move span{font-size:10px}.moves{gap:10px}.result{font-size:36px}.chat{position:relative;right:auto;bottom:auto;width:100%;margin-top:18px}.top{margin-bottom:15px}}</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">Live match arena</div><div>Room <span id="roomCode" class="room">—</span></div></div><button class="pill leave" onclick="leaveRoom()">Leave room</button></header><section class="arena"><div class="arena-head"><div><div class="eyebrow">Private duel</div><div id="roundLabel">Round 1</div></div><div id="modeLabel" class="pill">Unlimited</div></div><div class="players"><div class="player"><div id="youAvatar" class="avatar">🎮</div><small>You</small><strong id="youName">—</strong><div id="youScore" class="score">0</div></div><div class="vs">VS</div><div class="player"><div id="opponentAvatar" class="avatar">🎮</div><small>Opponent</small><strong id="opponentName">Waiting…</strong><div id="opponentScore" class="score">0</div></div></div><div id="status" class="status">Connecting to room…</div><div class="moves"><button class="move" data-move="rock" onclick="play('rock')">✊<span>Rock</span></button><button class="move" data-move="paper" onclick="play('paper')">✋<span>Paper</span></button><button class="move" data-move="scissors" onclick="play('scissors')">✌️<span>Scissors</span></button></div><div id="result" class="result"></div></section><section class="chat"><h3>ROOM CHAT</h3><div id="messages" class="messages">Say hello to your opponent.</div><div class="chatline"><input id="chatInput" maxlength="240" placeholder="Message…" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">Send</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://sktpjacowqaedddtrhuz.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrdHBqYWNvd3FhZWRkZHRyaHV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDk5MzEsImV4cCI6MjA5NDIyNTkzMX0.FK4N_ATFTaUuGXrYu_7OBn3qCdlo0rOzxk-E6TxJxqs');const q=new URLSearchParams(location.search),roomId=q.get('room'),slot=Number(q.get('slot')||1),uid=localStorage.rps_player_id;let room=null,lastResult=null,timer;const $=id=>document.getElementById(id);function safe(x){return String(x||'').replace(/[<>&"']/g,'')}async function poll(){let r=await db.from('rps_rooms').select('*').eq('id',roomId).single();if(r.error||!r.data){$('status').textContent='Room could not be found.';return}room=r.data;$('roomCode').textContent=room.room_code;$('youName').textContent=slot===1?room.p1_name:room.p2_name;$('opponentName').textContent=slot===1?(room.p2_name||'Waiting…'):(room.p1_name||'Waiting…');$('youScore').textContent=slot===1?room.p1_score:room.p2_score;$('opponentScore').textContent=slot===1?room.p2_score:room.p1_score;$('roundLabel').textContent='Round '+room.round_number;$('modeLabel').textContent=room.mode||'Unlimited';if(room.status==='waiting'){$('status').textContent='Send the room code to your opponent.';return}if(room.result){if(lastResult!==room.round_number+'-'+room.result){lastResult=room.round_number+'-'+room.result;let win=room.winner_id===uid;$('result').textContent=room.result==='draw'?'Draw!':win?'You win!':'Opponent wins';setButtons(false);setTimeout(nextRound,2600)}return}let move=slot===1?room.p1_move:room.p2_move;$('status').textContent=move?'Move locked. Waiting for your opponent…':'Choose your move.';setButtons(!move);loadChat()}function setButtons(on){document.querySelectorAll('.move').forEach(x=>x.disabled=!on)}async function play(move){if(!room||room.status!=='playing')return;let field=slot===1?'p1_move':'p2_move';await db.from('rps_rooms').update({[field]:move}).eq('id',room.id).is(field,null)}function winner(a,b){if(a===b)return'draw';return(a==='rock'&&b==='scissors')||(a==='paper'&&b==='rock')||(a==='scissors'&&b==='paper')?'p1':'p2'}async function resolve(){if(!room||!room.p1_move||!room.p2_move||room.result)return;let w=winner(room.p1_move,room.p2_move),patch={result:w,winner_id:w==='draw'?null:(w==='p1'?room.p1_id:room.p2_id)};if(w==='p1')patch.p1_score=room.p1_score+1;if(w==='p2')patch.p2_score=room.p2_score+1;await db.from('rps_rooms').update(patch).eq('id',room.id).eq('round_number',room.round_number).is('result',null)}async function nextRound(){if(!room||!room.result)return;await db.from('rps_rooms').update({round_number:room.round_number+1,p1_move:null,p2_move:null,result:null,winner_id:null}).eq('id',room.id).eq('round_number',room.round_number).not('result','is',null);lastResult=null}async function loadChat(){let r=await db.from('rps_messages').select('player_name,message').eq('room_id',roomId).order('created_at',{ascending:true}).limit(50);if(r.data)$('messages').innerHTML=r.data.length?r.data.map(x=>'<div><b style="color:#f4c542">'+safe(x.player_name)+':</b> '+safe(x.message)+'</div>').join(''):'Say hello to your opponent.'}async function sendChat(){let input=$('chatInput'),message=input.value.trim().slice(0,240);if(!message||!room)return;input.value='';await db.from('rps_messages').insert({room_id:roomId,player_id:uid,player_name:slot===1?room.p1_name:room.p2_name,message});loadChat()}async function leaveRoom(){if(room)await db.from('rps_rooms').update({status:'closed'}).eq('id',room.id);location.href='rps-live.html'}setInterval(()=>{poll();resolve()},900);poll();</script></body></html>
