x,22vw,115px);height:clamp(92px,27vw,140px)}}</style><style id="balanced-game-palette">:root{--bg:#11151f;--blue:#3566d4;--gold:#f4c542;--red:#b8322c;--ink:#fff8e7;--muted:#bbc3d2}html,body{background:#11151f!important}.arena,.chat{background:#1b202b!important;background-image:none!important;border-color:rgba(136,170,255,.2)!important}.player{background:#151a24!important;border-color:rgba(136,170,255,.2)!important}.move{background:#315fc6!important;background-image:none!important;border-color:rgba(136,170,255,.4)!important;box-shadow:0 12px 0 #0d1018!important}.vs{background:#b8322c!important}.pill{background:#242b38!important;border-color:rgba(136,170,255,.25)!important}.leave{background:#b8322c!important}.gesture-vs{color:#f4c542!important}</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">Live match arena</div><div>Room <span id="roomCode" class="room">—</span></div></div><button class="pill leave" onclick="leaveRoom()">Leave room</button></header><section class="arena"><div class="arena-head"><div><div class="eyebrow">Private duel</div><div id="roundLabel">Round 1</div></div><div id="modeLabel" class="pill">Unlimited</div></div><div class="players"><div class="player"><div id="youAvatar" class="avatar">🎮</div><small>You</small><strong id="youName">—</strong><div id="youScore" class="score">0</div></div><div class="vs">VS</div><div class="player"><div id="opponentAvatar" class="avatar">🎮</div><small>Opponent</small><strong id="opponentName">Waiting…</strong><div id="opponentScore" class="score">0</div></div></div><div id="gestureReveal" class="gesture-reveal" aria-live="polite"><img id="youGesture" class="gesture-hand" src="rps-mascot-rock.webp" alt="Your move"><span class="gesture-vs">VS</span><img id="opponentGesture" class="gesture-hand" src="rps-mascot-rock.webp" alt="Opponent move"></div><div id="status" class="status">Connecting to room…</div><div class="moves"><button class="move" data-move="rock" onclick="play('rock')"><img src="rps-mascot-rock.webp" alt=""><span>Rock</span></button><button class="move" data-move="paper" onclick="play('paper')"><img src="rps-mascot-paper.webp" alt=""><span>Paper</span></button><button class="move" data-move="scissors" onclick="play('scissors')"><img src="rps-mascot-scissors.webp" alt=""><span>Scissors</span></button></div><div id="result" class="result"></div><div id="botActions" class="bot-actions"><button class="pill" onclick="restartBotMatch()">Play again</button><button class="pill" onclick="location.href='rps-live.html'">Back to hub</button></div></section><section class="chat"><h3>ROOM CHAT</h3><div id="messages" class="messages">Say hello to your opponent.</div><div class="chatline"><input id="chatInput" maxlength="240" placeholder="Message…" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">Send</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://sktpjacowqaedddtrhuz.supabase.co','sb_publishable_ChdrHQEJV7pVpJMKt-ZaUw_6V0WRKAR');const q=new URLSearchParams(location.search),isBot=q.get('bot')==='1',roomId=q.get('room'),slot=Number(q.get('slot')||1),uid=localStorage.rps_player_id;let room=null,lastResult=null,lastGestureRound=null,timer,botFinished=false;const botDifficulty=q.get('difficulty')||'normal';const $=id=>document.getElementById(id);function safe(x){return String(x||'').replace(/[<>&"']/g,'')}function startBotMode(){let name=localStorage.rps_username||'Player',format=q.get('format')||'unlimited',max=format==='best3'?3:format==='best5'?5:format==='best10'?10:null;room={id:'bot-local',room_code:'SOLO',p1_id:uid,p1_name:name,p2_name:'Bot · '+botDifficulty.charAt(0).toUpperCase()+botDifficulty.slice(1),status:'playing',round_number:1,p1_score:0,p2_score:0,p1_move:null,p2_move:null,result:null,mode:format,max_rounds:max};$('roomCode').textContent='SOLO';$('youName').textContent=name;$('youAvatar').textContent=localStorage.rps_avatar||'🦊';$('opponentName').textContent=room.p2_name;$('opponentAvatar').textContent='🤖';$('modeLabel').textContent=format==='unlimited'?'Unlimited':format.replace('best','Best of ');$('status').textContent='Solo match · '+botDifficulty+' bot';document.querySelector('.chat').style.display='none';setButtons(true)}function botPick(playerMove){let counter={rock:'paper',paper:'scissors',scissors:'rock'}[playerMove],chance=botDifficulty==='easy' ? .2 : botDifficulty==='hard' ? .72 : .45;return Math.random()<chance?counter:['rock','paper','scissors'][Math.floor(Math.random()*3)]}function restartBotMatch(){if(!isBot)return;botFinished=false;room.round_number=1;room.p1_score=0;room.p2_score=0;room.p1_move=null;room.p2_move=null;room.result=null;lastGestureRound=null;lastResult=null;$('youScore').textContent='0';$('opponentScore').textContent='0';$('roundLabel').textContent='Round 1';$('result').textContent='';$('botActions').style.display='none';$('status').textContent='Choose your move.';setButtons(true)}function nextBotRound(){if(botFinished)return;room.round_number++;room.p1_move=null;room.p2_move=null;room.result=null;lastResult=null;lastGestureRound=null;$('gestureReveal').classList.remove('active');document.querySelectorAll('.move').forEach(x=>x.classList.remove('is-locked','is-throwing'));$('roundLabel').textContent='Round '+room.round_number;$('result').textContent='';$('status').textContent='Choose your move.';setButtons(true)}function finishBotRound(outcome){room.result=outcome;if(outcome==='p1')room.p1_score++;if(outcome==='p2')room.p2_score++;$('youScore').textContent=room.p1_score;$('opponentScore').textContent=room.p2_score;revealHands();$('result').textContent=outcome==='draw'?'Draw!':outcome==='p1'?'You win!':'Bot wins!';let target=room.max_rounds?Math.ceil(room.max_rounds/2):null;botFinished=!!target&&(room.p1_score>=target||room.p2_score>=target);$('status').textContent=botFinished?(room.p1_score>room.p2_score?'Match won!':'Bot won the match.'):'Round revealed!';if(botFinished)$('botActions').style.display='flex';setButtons(false);setTimeout(()=>{if(!botFinished)nextBotRound()},1300)}async function poll(){let r=await db.from('rps_rooms').select('*').eq('id',roomId).single();if(r.error||!r.data){$('status').textContent='Room could not be found.';return}room=r.data;$('roomCode').textContent=room.room_code;$('youName').textContent=slot===1?room.p1_name:room.p2_name;$('opponentName').textContent=slot===1?(room.p2_name||'Waiting…'):(room.p1_name||'Waiting…');$('youScore').textContent=slot===1?room.p1_score:room.p2_score;$('opponentScore').textContent=slot===1?room.p2_score:room.p1_score;$('roundLabel').textContent='Round '+room.round_number;$('modeLabel').textContent=room.mode||'Unlimited';if(room.status==='waiting'){$('status').textContent='Send the room code to your opponent.';return}if(room.p1_move&&room.p2_move)revealHands();if(room.result){if(lastResult!==room.round_number+'-'+room.result){lastResult=room.round_number+'-'+room.result;let win=room.winner_id===uid;$('result').textContent=room.result==='draw'?'Draw!':win?'You win!':'Opponent wins';$('status').textContent='Round revealed!';setButtons(false);setTimeout(nextRound,2600)}return}let move=slot===1?room.p1_move:room.p2_move;$('status').textContent=move?'Move locked. Waiting for your opponent…':'Choose your move.';setButtons(!move);loadChat()}function setButtons(on){document.querySelectorAll('.move').forEach(x=>x.disabled=!on)}async function play(move){if(!room||room.status!=='playing'||botFinished)return;let button=document.querySelector('[data-move="'+move+'"]');if(button){button.classList.remove('is-throwing');void button.offsetWidth;button.classList.add('is-throwing','is-locked')}if(isBot){room.p1_move=move;setButtons(false);$('status').textContent='Bot is choosing…';setTimeout(()=>{try{if(!room||botFinished)return;room.p2_move=botPick(move);let outcome=winner(room.p1_move,room.p2_move);finishBotRound(outcome)}catch(e){console.error('Bot round error',e);$('status').textContent='The bot round hit a snag. Tap a move to retry.';room.p1_move=null;room.p2_move=null;setButtons(true)}},180);return}let field=slot===1?'p1_move':'p2_move';let r=await db.from('rps_rooms').update({[field]:move}).eq('id',room.id).is(field,null);if(r.error){$('status').textContent='Move did not save. Tap again.';if(button)button.classList.remove('is-locked')}}function revealHands(){let signature=room.round_number+'-'+room.p1_move+'-'+room.p2_move;if(signature===lastGestureRound)return;lastGestureRound=signature;const poses={rock:'rps-mascot-rock.webp',paper:'rps-mascot-paper.webp',scissors:'rps-mascot-scissors.webp'},you=slot===1?room.p1_move:room.p2_move,opponent=slot===1?room.p2_move:room.p1_move;$('youGesture').src=poses[you]||poses.rock;$('youGesture').alt='Your '+(you||'rock')+' pose';$('opponentGesture').src=poses[opponent]||poses.rock;$('opponentGesture').alt='Opponent '+(opponent||'rock')+' pose';let stage=$('gestureReveal');stage.classList.remove('active');void stage.offsetWidth;stage.classList.add('active')}function winner(a,b){if(a===b)return'draw';return(a==='rock'&&b==='scissors')||(a==='paper'&&b==='rock')||(a==='scissors'&&b==='paper')?'p1':'p2'}async function resolve(){if(!room||!room.p1_move||!room.p2_move||room.result)return;let w=winner(room.p1_move,room.p2_move),patch={result:w,winner_id:w==='draw'?null:(w==='p1'?room.p1_id:room.p2_id)};if(w==='p1')patch.p1_score=room.p1_score+1;if(w==='p2')patch.p2_score=room.p2_score+1;await db.from('rps_rooms').update(patch).eq('id',room.id).eq('round_number',room.round_number).is('result',null)}async function nextRound(){if(!room||!room.result)return;await db.from('rps_rooms').update({round_number:room.round_number+1,p1_move:null,p2_move:null,result:null,winner_id:null}).eq('id',room.id).eq('round_number',room.round_number).not('result','is',null);lastResult=null;lastGestureRound=null;$('gestureReveal').classList.remove('active');document.querySelectorAll('.move').forEach(x=>x.classList.remove('is-locked','is-throwing'))}async function loadChat(){let r=await db.from('rps_messages').select('player_name,message').eq('room_id',roomId).order('created_at',{ascending:true}).limit(50);if(r.data)$('messages').innerHTML=r.data.length?r.data.map(x=>'<div><b style="color:#f4c542">'+safe(x.player_name)+':</b> '+safe(x.message)+'</div>').join(''):'Say hello to your opponent.'}async function sendChat(){let input=$('chatInput'),message=input.value.trim().slice(0,240);if(!message||!room)return;input.value='';await db.from('rps_messages').insert({room_id:roomId,player_id:uid,player_name:slot===1?room.p1_name:room.p2_name,message});loadChat()}async function leaveRoom(){if(room&&!isBot)await db.from('rps_rooms').update({status:'closed'}).eq('id',room.id);location.href='rps-live.html'}if(isBot)startBotMode();else{setInterval(()=>{poll();resolve()},900);poll()}</script></body></html>
