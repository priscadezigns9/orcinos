<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a45"><title>Choose a match</title><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#101a45;--card:#172554;--blue:#2450c5;--gold:#f4c542;--ink:#fff8e7;--muted:#b9c8ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Urbanist,sans-serif}.wrap{width:min(620px,92%);margin:auto;padding:28px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.eyebrow{font-size:10px;color:#93c5fd;font-weight:800;letter-spacing:2px;text-transform:uppercase}.back,.tab{border:1px solid rgba(147,197,253,.4);background:var(--card);color:#dbeafe;border-radius:999px;padding:10px 14px;font:800 11px Urbanist;cursor:pointer}.hero{text-align:center;margin-bottom:24px}.tokens{font-size:52px;letter-spacing:7px}.hero h1{font:clamp(42px,9vw,64px)/.95 'DM Serif Display';margin:12px 0}.hero p{color:var(--muted);line-height:1.5}.card{background:var(--card);border:1px solid rgba(147,197,253,.4);border-radius:28px;padding:26px;box-shadow:0 25px 65px rgba(0,0,0,.3)}.tabs{display:flex;gap:8px;margin-bottom:22px}.tab{flex:1}.tab.active{background:var(--gold);color:#3b1b08;border-color:var(--gold)}.view{display:none}.view.active{display:block}.card h2{margin:0 0 18px;font-size:19px}.label{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px}.input,select{width:100%;padding:14px;border:1px solid #4562a0;border-radius:12px;background:var(--bg);color:var(--ink);font:14px Urbanist}.avatars{display:flex;gap:9px;flex-wrap:wrap}.avatar{width:46px;height:46px;border-radius:50%;border:2px solid rgba(147,197,253,.3);background:#243b85;color:white;font-size:24px;cursor:pointer}.avatar.selected,.avatar:hover{border-color:var(--gold);transform:translateY(-3px)}.btn{width:100%;padding:16px;border:0;border-radius:14px;background:var(--gold);color:#3b1b08;font:800 14px Urbanist;cursor:pointer;margin-top:18px}.btn.alt{background:var(--blue);color:var(--ink)}.hint{min-height:18px;color:var(--muted);font-size:12px;margin-top:10px}.error{color:#ffb4a6}</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">RPS multiplayer</div><strong>Choose a match</strong></div><button class="back" onclick="location.href='rps-live.html'">Back to hub</button></header><section class="hero"><div class="tokens">✊ ✋ ✌</div><h1>Ready to play?</h1><p>Choose one action below to enter the arena.</p></section><section class="card"><div class="tabs"><button id="createTab" class="tab active" onclick="show('create')">Create room</button><button id="joinTab" class="tab" onclick="show('join')">Join room</button></div><div id="create" class="view active"><h2>Create a private room</h2><label class="label">Avatar</label><div class="avatars"><button class="avatar selected" onclick="choose(this,'🦊')">🦊</button><button class="avatar" onclick="choose(this,'🐼')">🐼</button><button class="avatar" onclick="choose(this,'🐸')">🐸</button><button class="avatar" onclick="choose(this,'🐯')">🐯</button><button class="avatar" onclick="choose(this,'🐙')">🐙</button></div><label class="label">Username</label><input id="name" class="input" maxlength="24" placeholder="Choose a username"><label class="label">Match format</label><select id="mode"><option value="unlimited">Unlimited rounds</option><option value="best3">Best of 3</option><option value="best5">Best of 5</option><option value="best10">Best of 10</option></select><button class="btn" onclick="createRoom()">Create private room</button><div id="createMsg" class="hint"></div></div><div id="join" class="view"><h2>Join a private room</h2><label class="label">Avatar</label><div class="avatars"><button class="avatar selected" onclick="choose(this,'🦊')">🦊</button><button class="avatar" onclick="choose(this,'🐼')">🐼</button><button class="avatar" onclick="choose(this,'🐸')">🐸</button><button class="avatar" onclick="choose(this,'🐯')">🐯</button><button class="avatar" onclick="choose(this,'🐙')">🐙</button></div><label class="label">Username</label><input id="joinName" class="input" maxlength="24" placeholder="Choose a username"><label class="label">Room code</label><input id="code" class="input" maxlength="6" placeholder="A7K2Q9" style="text-transform:uppercase"><button class="btn alt" onclick="joinRoom()">Join private room</button><div id="joinMsg" class="hint"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://sktpjacowqaedddtrhuz.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrdHBqYWNvd3RyaHV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDk5MzEsImV4cCI6MjA5NDIyNTkzMX0.FK4N_ATFTUAuGXrYu_7OBn3qCdlo0rOzxk-E6TxJxqs');let avatar='🦊',uid=localStorage.rps_player_id||(localStorage.rps_player_id=crypto.randomUUID?crypto.randomUUID():'p-'+Math.random().toString(36).slice(2));const $=id=>document.getElementById(id);function show(which){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(which).classList.add('active');$(which+'Tab').classList.add('active')}function choose(b,a){avatar=a;document.querySelectorAll('.avatar').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}function clean(x){return(x||'').trim().replace(/[^a-z0-9 ]/gi,'').slice(0,24)}function msg(id,t,e){$(id).textContent=t;$(id).className=e?'hint error':'hint'}async function profile(name){let r=await db.from('rps_players').select('*').eq('guest_token',uid).maybeSingle();if(!r.data)r=await db.from('rps_players').insert({guest_token:uid,username:name,avatar,profile_code:Math.random().toString(36).slice(2,8).toUpperCase()}).select().single();return r.data}async function createRoom(){let name=clean($('name').value);if(!name)return msg('createMsg','Enter a username first.',true);let p=await profile(name);if(!p)return msg('createMsg','Profile could not be loaded.',true);let mode=$('mode').value,code=Math.random().toString(36).slice(2,8).toUpperCase(),r=await db.from('rps_rooms').insert({room_code:code,p1_id:uid,p1_name:name,status:'waiting',round_number:1,p1_score:0,p2_score:0,p1_player_id:p.id,mode,max_rounds:mode==='best3'?3:mode==='best5'?5:mode==='best10'?10:null}).select().single();if(r.error)return msg('createMsg','Room could not be created.',true);location.href='rps-match.html?room='+encodeURIComponent(r.data.id)+'&slot=1'}async function joinRoom(){let name=clean($('joinName').value),code=$('code').value.trim().toUpperCase();if(!name||!code)return msg('joinMsg','Enter your username and room code.',true);let p=await profile(name),r=await db.from('rps_rooms').select('*').eq('room_code',code).eq('status','waiting').maybeSingle();if(!r.data)return msg('joinMsg','That room is not available.',true);let u=await db.from('rps_rooms').update({p2_id:uid,p2_name:name,p2_player_id:p.id,status:'playing'}).eq('id',r.data.id).eq('status','waiting').select().single();if(u.error||!u.data)return msg('joinMsg','That room was just filled.',true);location.href='rps-match.html?room='+encodeURIComponent(u.data.id)+'&slot=2'}</script></body></html>
