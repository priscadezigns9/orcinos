<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velloq Link | Personnel Portal</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap');
        body { background: #080d1f; color: white; font-family: 'Urbanist', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .clay-card { 
            background: rgba(255, 255, 255, 0.03); border-radius: 32px; 
            box-shadow: inset 8px 8px 16px rgba(255,255,255,0.02), inset -8px -8px 16px rgba(0,0,0,0.2), 10px 10px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        #as { display: none; }
    </style>
</head>
<body class="min-h-screen">
    <div id="ls" class="fixed inset-0 z-[100] bg-[#080d1f] flex items-center justify-center p-6">
        <div class="max-w-md w-full glass p-10 rounded-[2.5rem] text-center">
            <img src="https://priscadezigns.org/vela/vela_logo.png" class="h-20 mx-auto mb-6 rounded-2xl">
            <h1 class="text-3xl font-bold tracking-tighter uppercase mb-8">Velloq <span class="opacity-20">Link</span></h1>
            <div class="space-y-4 text-left">
                <input id="e" placeholder="Work Email" class="w-full bg-white/5 border border-white/10 rounded-2xl p-5 outline-none focus:border-blue-500">
                <input id="p" type="password" placeholder="Access Token" class="w-full bg-white/5 border border-white/10 rounded-2xl p-5 outline-none focus:border-blue-500">
                <button onclick="login()" class="w-full py-5 rounded-2xl bg-blue-600 font-bold text-lg">AUTHENTICATE</button>
            </div>
        </div>
    </div>
    <div id="as" class="flex flex-col min-h-screen p-6 pb-24">
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl clay-card overflow-hidden">
                    <img id="u-img" src="" class="w-full h-full object-cover">
                </div>
                <div>
                    <h2 id="u-name" class="font-bold text-xl tracking-tight"></h2>
                    <p id="u-role" class="text-[10px] opacity-20 uppercase tracking-widest"></p>
                </div>
            </div>
            <button onclick="logout()" class="p-4 glass rounded-2xl text-[10px] uppercase font-bold opacity-30">Sign Out</button>
        </header>
        <div class="space-y-6">
            <div class="clay-card p-8">
                <div class="flex justify-between items-center mb-6"><p class="text-[10px] opacity-20 uppercase font-bold tracking-widest">Duty Status</p><div id="status-tag" class="px-4 py-1 bg-red-500/10 text-red-500 text-[9px] font-bold rounded-full">OFF DUTY</div></div>
                <div id="timer" class="text-5xl font-bold tracking-tighter mb-8">00:00:00</div>
                <button id="shift-btn" onclick="toggleShift()" class="w-full py-5 rounded-2xl bg-blue-600 font-bold text-lg">START SHIFT</button>
            </div>
            <div class="clay-card p-8"><p class="text-[10px] opacity-20 uppercase font-bold tracking-widest mb-6">Identity Vault</p><div class="space-y-4" id="vault-data"></div></div>
            <div class="clay-card p-8"><p class="text-[10px] opacity-20 uppercase font-bold tracking-widest mb-6">Digital Requests</p>
                <div class="grid grid-cols-2 gap-4">
                    <button class="bg-white/5 p-4 rounded-2xl text-[10px] font-bold text-left">📄 Job Letter</button>
                    <button class="bg-white/5 p-4 rounded-2xl text-[10px] font-bold text-left">🌴 Leave Request</button>
                    <button class="bg-white/5 p-4 rounded-2xl text-[10px] font-bold text-left">💰 Payslip</button>
                    <button class="bg-white/5 p-4 rounded-2xl text-[10px] font-bold text-left">🩺 Sick Leave</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const users = [
            { e: "priscillanarine@gmail.com", p: "PRISY P", n: "Priscilla Narine", r: "Sovereign / CTO", bir: "BIR-998237-X", nis: "NIS-449201-Z", id: "ID-19940723-5", lic: "LIC-TT-88273", img: "https://ui-avatars.com/api/?name=Priscilla+Narine&background=7c3aed&color=fff", w: {lat: 10.2833, lng: -61.4667} },
            { e: "jason.rivers@amber-sim.local", p: "Jason123", n: "Jason Rivers", r: "Fleet Driver", bir: "BIR-112233-J", nis: "NIS-445566-K", id: "ID-19900101-J", lic: "LIC-TT-11223", img: "https://ui-avatars.com/api/?name=Jason+Rivers&background=2563eb&color=fff", w: {lat: 10.5167, lng: -61.4167} }
        ];
        window.onload = () => { const u = JSON.parse(localStorage.getItem('v_u')); if(u) s(u); };
        function login() { const e = document.getElementById('e').value.trim().toLowerCase(), p = document.getElementById('p').value.trim(), found = users.find(u => u.e === e && u.p === p); if(found) { localStorage.setItem('v_u', JSON.stringify(found)); s(found); } else alert('Invalid'); }
        function s(u) { document.getElementById('ls').style.display = 'none'; document.getElementById('as').style.display = 'flex'; document.getElementById('u-name').innerText = u.n; document.getElementById('u-role').innerText = u.r; document.getElementById('u-img').src = u.img; document.getElementById('vault-data').innerHTML = `<div class="flex justify-between text-xs opacity-50"><span>BIR</span> <span class="font-bold">${u.bir}</span></div><div class="flex justify-between text-xs opacity-50"><span>NIS</span> <span class="font-bold">${u.nis}</span></div><div class="flex justify-between text-xs opacity-50"><span>ID</span> <span class="font-bold">${u.id}</span></div><div class="flex justify-between text-xs opacity-50"><span>License</span> <span class="font-bold">${u.lic}</span></div>`; }
        function logout() { localStorage.clear(); location.reload(); }
        let active = false, interval, sec = 0;
        function toggleShift() { active = !active; const btn = document.getElementById('shift-btn'), tag = document.getElementById('status-tag'); if(active) { btn.innerText = "STOP SHIFT"; btn.style.background = "#ef4444"; tag.innerText = "ON DUTY"; tag.style.color = "#22c55e"; interval = setInterval(() => { sec++; document.getElementById('timer').innerText = new Date(sec * 1000).toISOString().substr(11, 8); }, 1000); } else { clearInterval(interval); btn.innerText = "START SHIFT"; btn.style.background = "#2563eb"; tag.innerText = "OFF DUTY"; tag.style.color = "#ef4444"; } }
    </script>
</body>
</html>
