<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velloq Link | Personnel Portal</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap');
        body { background: #080d1f; color: white; font-family: 'Urbanist', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .clay-card { background: rgba(255, 255, 255, 0.03); border-radius: 32px; box-shadow: inset 8px 8px 16px rgba(255,255,255,0.02), inset -8px -8px 16px rgba(0,0,0,0.2), 10px 10px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255, 255, 255, 0.08); }
        #mini-map { height: 200px; width: 100%; border-radius: 24px; margin-top: 1.5rem; z-index: 1; border: 1px solid rgba(255,255,255,0.1); }
        #as { display: none; }
    </style>
</head>
<body class="min-h-screen">
    <div id="ls" class="fixed inset-0 z-[100] bg-[#080d1f] flex items-center justify-center p-6"><div class="max-w-md w-full glass p-10 rounded-[2.5rem] text-center"><img src="https://priscadezigns.org/vela/vela_logo.png" class="h-20 mx-auto mb-6 rounded-2xl"><h1 class="text-3xl font-bold uppercase tracking-tighter mb-8">Velloq <span class="opacity-20">Link</span></h1><div class="space-y-4"><input id="e" placeholder="Email" class="w-full bg-white/5 border border-white/10 rounded-2xl p-5 outline-none focus:border-blue-500"><input id="p" type="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded-2xl p-5 outline-none focus:border-blue-500"><button onclick="login()" class="w-full py-5 rounded-2xl bg-blue-600 font-bold text-lg">AUTHENTICATE</button></div></div></div>
    <div id="as" class="flex flex-col min-h-screen p-6 pb-24"><header class="flex justify-between items-center mb-8"><div class="flex items-center gap-4"><div class="w-14 h-14 rounded-2xl clay-card overflow-hidden"><img id="u-img" src="" class="w-full h-full object-cover"></div><div><h2 id="u-name" class="font-bold text-xl"></h2><p id="u-role" class="text-[10px] opacity-20 uppercase tracking-widest"></p></div></div><button onclick="logout()" class="p-4 glass rounded-2xl text-[10px] uppercase font-bold opacity-30">Sign Out</button></header>
    <div class="space-y-6"><div class="clay-card p-8"><div class="flex justify-between items-center mb-6"><p class="text-[10px] opacity-20 uppercase font-bold">Duty Status</p><div id="st" class="px-4 py-1 bg-red-500/10 text-red-500 text-[9px] font-bold rounded-full uppercase">Off Duty</div></div><div id="timer" class="text-5xl font-bold tracking-tighter mb-8">00:00:00</div><button id="sb" onclick="tS()" class="w-full py-5 rounded-2xl bg-blue-600 font-bold text-lg mb-4 uppercase">Start Shift</button><div id="mini-map"></div><p id="gs" class="text-center text-[10px] opacity-20 uppercase mt-4">GPS Standby</p></div><div class="clay-card p-8"><p class="text-[10px] opacity-20 uppercase font-bold mb-6">Identity Vault</p><div id="vd" class="space-y-4"></div></div></div></div>
    <script>
        const users = [{ e: "priscillanarine@gmail.com", p: "PRISY P", n: "Priscilla Narine", r: "Sovereign / CTO", bir: "BIR-998237-X", nis: "NIS-449201-Z", id: "ID-19940723-5", lic: "LIC-TT-88273", img: "https://ui-avatars.com/api/?name=Priscilla+Narine&background=7c3aed&color=fff" }, { e: "jason.rivers@amber-sim.local", p: "Jason123", n: "Jason Rivers", r: "Driver", bir: "BIR-112233-J", nis: "NIS-445566-K", id: "ID-19900101-J", lic: "LIC-TT-11223", img: "https://ui-avatars.com/api/?name=Jason+Rivers&background=2563eb&color=fff" }];
        let map, marker, act = false, iv, sec = 0;
        window.onload = () => { const u = JSON.parse(localStorage.getItem('v_u')); if(u) s(u); };
        function login() { const e=document.getElementById('e').value.trim().toLowerCase(), p=document.getElementById('p').value.trim(), f=users.find(u=>u.e===e && u.p===p); if(f){localStorage.setItem('v_u',JSON.stringify(f)); s(f);} else alert('Invalid'); }
        function s(u) { document.getElementById('ls').style.display='none'; document.getElementById('as').style.display='flex'; document.getElementById('u-name').innerText=u.n; document.getElementById('u-role').innerText=u.r; document.getElementById('u-img').src=u.img; document.getElementById('vd').innerHTML = `<div class="flex justify-between text-xs opacity-50"><span>BIR</span> <span class="font-bold">${u.bir}</span></div><div class="flex justify-between text-xs opacity-50"><span>NIS</span> <span class="font-bold">${u.nis}</span></div><div class="flex justify-between text-xs opacity-50"><span>ID</span> <span class="font-bold">${u.id}</span></div><div class="flex justify-between text-xs opacity-50"><span>License</span> <span class="font-bold">${u.lic}</span></div>`; initMap(); }
        function initMap() { map = L.map('mini-map', { zoomControl: false }).setView([10.1844, -61.5533], 15); L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map); marker = L.circleMarker([10.1844, -61.5533], { color: '#2563eb', radius: 8, fillOpacity: 0.8 }).addTo(map); }
        function tS() { act = !act; const b = document.getElementById('sb'), t = document.getElementById('st'), g = document.getElementById('gs'); if(act) { b.innerText = "STOP SHIFT"; b.style.background = "#ef4444"; t.innerText = "On Duty"; t.style.color = "#22c55e"; iv = setInterval(() => { sec++; document.getElementById('timer').innerText = new Date(sec * 1000).toISOString().substr(11, 8); tr(); }, 1000); } else { clearInterval(iv); b.innerText = "START SHIFT"; b.style.background = "#2563eb"; t.innerText = "Off Duty"; t.style.color = "#ef4444"; g.innerText = "GPS Standby"; } }
        function tr() { if (!navigator.geolocation) return; navigator.geolocation.getCurrentPosition((p) => { const { latitude, longitude } = p.coords; marker.setLatLng([latitude, longitude]); map.panTo([latitude, longitude]); document.getElementById('gs').innerText = `Live: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`; }); }
        function lo() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
