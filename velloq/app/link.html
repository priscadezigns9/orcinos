<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velloq Link | Employee Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #080d1f; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-glow:active { transform: scale(0.98); }
        .pulse-active { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-2xl font-bold tracking-tighter text-velloq-blue">VELLOQ <span class="text-white/40">LINK</span></h1>
            <p id="employee-name" class="text-xs text-white/50 uppercase tracking-widest mt-1">Authenticating...</p>
        </div>
        <div id="duty-indicator" class="w-3 h-3 rounded-full bg-white/10"></div>
    </div>

    <!-- Main Controls -->
    <div class="flex-1 flex flex-col justify-center space-y-6">
        <div id="status-card" class="glass rounded-3xl p-8 text-center">
            <p id="status-text" class="text-sm text-white/40 mb-2">System Standby</p>
            <h2 id="timer" class="text-5xl font-mono font-bold mb-6">00:00:00</h2>
            
            <button id="shift-btn" class="w-full py-5 rounded-2xl bg-white text-black font-bold text-lg btn-glow transition-all">
                START SHIFT
            </button>
        </div>

        <button onclick="toggleComplaint()" class="glass w-full py-4 rounded-2xl text-sm font-medium text-white/60 hover:text-white transition-all">
            SUBMIT COMPLAINT / REPORT
        </button>
    </div>

    <!-- Complaint Modal (Hidden) -->
    <div id="complaint-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-6 z-50">
        <div class="glass w-full max-w-sm rounded-3xl p-8">
            <h3 class="text-xl font-bold mb-4">Submit Report</h3>
            <input id="comp-subject" type="text" placeholder="Subject" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 mb-3 focus:outline-none focus:border-white/20">
            <textarea id="comp-message" placeholder="Describe the issue..." rows="4" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 mb-6 focus:outline-none focus:border-white/20"></textarea>
            <div class="flex space-x-3">
                <button onclick="toggleComplaint()" class="flex-1 py-3 rounded-xl bg-white/5 font-medium">Cancel</button>
                <button onclick="submitComplaint()" class="flex-1 py-3 rounded-xl bg-white text-black font-bold">Submit</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sktpjacowqaedddtrhuz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrdHBqYWNvd3FhZWRkZHRyaHV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDk5MzEsImV4cCI6MjA5NDIyNTkzMX0.FK4N_ATFTaUuGXrYu_7OBn3qCdlo0rOzxk-E6TxJxqs';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'orcinos' } });

        let isOnDuty = false;
        let watchId = null;
        let employeeId = null; // To be set via Login/Auth flow

        const shiftBtn = document.getElementById('shift-btn');
        const statusText = document.getElementById('status-text');
        const dutyIndicator = document.getElementById('duty-indicator');

        async function toggleShift() {
            if (!isOnDuty) {
                // START SHIFT Logic
                isOnDuty = true;
                shiftBtn.innerText = 'END SHIFT';
                shiftBtn.classList.replace('bg-white', 'bg-red-500');
                shiftBtn.classList.add('text-white');
                statusText.innerText = 'ACTIVE DUTY - GPS LIVE';
                dutyIndicator.classList.replace('bg-white/10', 'bg-green-400');
                dutyIndicator.classList.add('pulse-active');
                
                // Start Geo-Tracking
                startTracking();
            } else {
                // END SHIFT Logic
                isOnDuty = false;
                shiftBtn.innerText = 'START SHIFT';
                shiftBtn.classList.replace('bg-red-500', 'bg-white');
                shiftBtn.classList.remove('text-white');
                statusText.innerText = 'Shift Ended';
                dutyIndicator.classList.replace('bg-green-400', 'bg-white/10');
                dutyIndicator.classList.remove('pulse-active');
                
                stopTracking();
            }
        }

        function startTracking() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(async (pos) => {
                    await _supabase.from('v_telemetry').insert([{
                        personnel_id: employeeId,
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude,
                        speed: (pos.coords.speed || 0) * 3.6
                    }]);
                }, (err) => console.error(err), { enableHighAccuracy: true });
            }
        }

        function stopTracking() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
        }

        function toggleComplaint() {
            document.getElementById('complaint-modal').classList.toggle('hidden');
        }

        async function submitComplaint() {
            const subject = document.getElementById('comp-subject').value;
            const message = document.getElementById('comp-message').value;
            // Logic to insert into v_complaints...
            toggleComplaint();
            alert('Report Submitted Successfully');
        }

        shiftBtn.addEventListener('click', toggleShift);
    </script>
</body>
</html>
