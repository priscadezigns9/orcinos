<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velloq Link</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#080d1f] text-white flex items-center justify-center min-h-screen p-6">
<div id="ls" class="max-w-sm w-full space-y-6">
<div class="text-center"><img src="https://priscadezigns.org/vela/vela_logo.png" class="h-20 mx-auto rounded-2xl mb-4"><h1 class="text-4xl font-bold text-blue-500">VELLOQ <span class="text-white/40">LINK</span></h1></div>
<div class="space-y-4"><input id="e" placeholder="Work Email" class="w-full bg-white/5 border border-white/10 rounded-2xl p-4"><div class="relative"><input id="p" type="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded-2xl p-4"><button onclick="p=document.getElementById('p');p.type=p.type==='password'?'text':'password'" class="absolute right-4 top-4">👁</button></div><button onclick="l=document.getElementById('e').value.trim().toLowerCase();w=document.getElementById('p').value.trim();if(l==='jason.rivers@amber-sim.local'&&w==='Jason123'){document.getElementById('ls').style.display='none';document.getElementById('as').style.display='flex';}else{alert('Invalid');}" class="w-full py-4 bg-blue-600 rounded-2xl font-bold">SIGN IN</button></div>
</div>
<div id="as" style="display:none" class="flex-col items-center space-y-6">
<h1 class="text-3xl font-bold text-blue-500">WELCOME JASON</h1>
<div class="grid grid-cols-2 gap-4"><button onclick="alert('Requests: Payslip, Leave, Job Letter')" class="bg-white/5 p-8 rounded-3xl">📄 HR</button><button onclick="alert('Image/Report Sent')" class="bg-white/5 p-8 rounded-3xl">📸 REPORT</button></div>
<button onclick="t=this;if(t.innerText==='START SHIFT'){t.innerText='END SHIFT';t.style.backgroundColor='#ef4444';}else{t.innerText='START SHIFT';t.style.backgroundColor='#ffffff';}" class="w-64 py-10 bg-white text-black font-bold text-2xl rounded-3xl">START SHIFT</button>
</div>
</body>
</html>
