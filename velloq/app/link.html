<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velloq Link | Employee Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #080d1f; color: white; font-family: sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 items-center justify-center">
    <div id="login-screen" class="max-w-sm w-full space-y-8">
        <div class="text-center">
            <img src="https://priscadezigns.org/vela/vela_logo.png" class="h-20 mx-auto mb-4 rounded-2xl">
            <h1 class="text-4xl font-bold text-blue-500">VELLOQ <span class="text-white/40">LINK</span></h1>
        </div>
        <div class="space-y-4">
            <input id="email" type="email" placeholder="Work Email" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4">
            <div class="relative">
                <input id="password" type="password" placeholder="Access Password" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4">
                <button onclick="p=document.getElementById('password');p.type=p.type==='password'?'text':'password'" class="absolute right-6 top-4">👁</button>
            </div>
            <button onclick="l=document.getElementById('email').value.trim();p=document.getElementById('password').value.trim();if(l==='jason.rivers@amber-sim.local'&&p==='Jason123'){document.getElementById('login-screen').style.display='none';document.getElementById('app-screen').style.display='flex';document.getElementById('un').innerText='JASON';}else{alert('Invalid');}" class="w-full py-4 rounded-2xl bg-blue-600 font-bold">SIGN IN</button>
        </div>
    </div>
    <div id="app-screen" style="display:none" class="flex-col items-center">
        <h1 class="text-3xl font-bold text-blue-500 mb-6">WELCOME, <span id="un"></span></h1>
        <button onclick="t=this;if(t.innerText==='START SHIFT'){t.innerText='END SHIFT';t.style.backgroundColor='#ef4444';}else{t.innerText='START SHIFT';t.style.backgroundColor='#ffffff';}" class="w-64 py-10 rounded-3xl bg-white text-black font-bold text-2xl">START SHIFT</button>
    </div>
</body>
</html>
