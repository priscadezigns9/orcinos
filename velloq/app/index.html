<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velloq | Command Center</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap');
        body { background: #080d1f; color: white; font-family: 'Urbanist', sans-serif; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .clay-card { 
            background: rgba(255, 255, 255, 0.03); border-radius: 32px; 
            box-shadow: inset 8px 8px 16px rgba(255,255,255,0.02), inset -8px -8px 16px rgba(0,0,0,0.2), 10px 10px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        #ls { display: none; }
    </style>
</head>
<body class="min-h-screen flex">
    <div id="ls" class="fixed inset-0 z-[120] bg-[#080d1f] flex items-center justify-center p-6">
        <div class="max-w-md w-full space-y-10 glass p-12 rounded-[3rem] text-center border-white/5">
            <img src="https://priscadezigns.org/vela/vela_logo.png" class="h-24 mx-auto mb-6 rounded-3xl">
            <h1 class="text-4xl font-bold tracking-tighter uppercase">Velloq <span class="opacity-20 font-light">Command</span></h1>
            <div class="space-y-4">
                <input id="e" placeholder="Work Email" class="w-full bg-white/5 border border-white/10 rounded-2xl p-5 outline-none focus:border-blue-500">
                <input id="p" type="password" placeholder="Access Token" class="w-full bg-white/5 border border-white/10 rounded-2xl p-5 outline-none focus:border-blue-500">
                <button onclick="login()" class="w-full py-5 rounded-2xl bg-blue-600 font-bold text-lg shadow-xl shadow-blue-600/40">AUTHENTICATE</button>
            </div>
        </div>
    </div>

    <div id="md" class="hidden flex-1 flex h-screen">
        <aside class="w-80 glass border-r border-white/5 flex flex-col p-10 space-y-12">
            <div class="flex items-center gap-4">
                <img src="https://priscadezigns.org/vela/vela_logo.png" class="h-10">
                <span class="font-bold tracking-tighter text-2xl uppercase">Velloq</span>
            </div>
            <nav class="flex-1 space-y-4">
                <div class="p-5 bg-white/5 rounded-2xl font-bold text-blue-400">Tactical Hub</div>
            </nav>
            <div class="pt-10 border-t border-white/5">
                <p id="un" class="font-bold text-lg"></p>
                <p id="ur" class="text-[9px] opacity-20 uppercase"></p>
                <button onclick="logout()" class="mt-6 text-red-500/50 uppercase text-[10px]">Sign Out</button>
            </div>
        </aside>
        <main class="flex-1 p-12 overflow-y-auto">
            <div class="grid grid-cols-3 gap-10">
                <div class="clay-card p-10"><p class="text-[10px] opacity-20 uppercase font-bold mb-2">Fleet Pulse</p><p class="text-4xl font-bold">20 / 20</p></div>
            </div>
        </main>
    </div>

    <script>
        const users = [
            { e: "priscillanarine@gmail.com", p: "PRISY P", n: "Priscilla Narine", r: "Sovereign / CTO" },
            { e: "alice@amber-sim.local", p: "Alice123", n: "Alice", r: "Sovereign" }
        ];
        window.onload = () => {
            const u = JSON.parse(localStorage.getItem('v_adm'));
            if (u) { s(u.n, u.r); } else { document.getElementById('ls').style.display = 'flex'; }
        };
        function login() {
            const e = document.getElementById('e').value.trim().toLowerCase(), p = document.getElementById('p').value.trim();
            const found = users.find(u => u.e === e && u.p === p);
            if(found) { s(found.n, found.r); localStorage.setItem('v_adm', JSON.stringify({n:found.n,r:found.r})); }
            else alert('Access Denied');
        }
        function s(n, r) {
            document.getElementById('ls').style.display = 'none';
            document.getElementById('md').classList.remove('hidden');
            document.getElementById('un').innerText = n;
            document.getElementById('ur').innerText = r;
        }
        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
