<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Velloq | Command Center</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#080d1f] text-white flex items-center justify-center min-h-screen p-6">
<div id="ls" class="max-w-md w-full space-y-8 bg-white/5 p-10 rounded-3xl">
<div class="text-center"><img src="https://priscadezigns.org/vela/vela_logo.png" class="h-20 mx-auto rounded-2xl mb-4"><h1 class="text-4xl font-bold text-blue-500">VELLOQ</h1></div>
<div class="space-y-4"><input id="e" placeholder="Authorized Email" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 outline-none"><div class="relative"><input id="p" type="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 outline-none"><button onclick="x=document.getElementById('p');x.type=x.type==='password'?'text':'password'" class="absolute right-4 top-4">👁</button></div><button onclick="u=document.getElementById('e').value.trim().toLowerCase();w=document.getElementById('p').value.trim();if(u==='alice@amber-sim.local'&&w==='Alice123'){s('ALICE','Sovereign');}else if(u==='amir.narine@amber-sim.local'&&w==='Amir123'){s('AMIR','Admin');document.getElementById('at').style.display='none';}else{alert('Invalid');}" class="w-full py-4 bg-blue-600 rounded-xl font-bold">AUTHENTICATE</button></div>
</div>
<div id="md" style="display:none" class="w-full max-w-6xl flex">
<aside class="w-64 bg-white/5 p-8 rounded-3xl mr-8 min-h-[60vh]"><div class="flex items-center gap-3 mb-10"><img src="https://priscadezigns.org/vela/vela_logo.png" class="h-6"><span class="font-bold">VELLOQ</span></div><nav class="space-y-4"><div class="text-blue-400 font-bold">🗺️ Map</div><div class="opacity-20">📈 Analytics</div><div id="at" class="opacity-20">⚙️ Management</div></nav><div class="mt-20"><p id="un" class="font-bold"></p><p id="ur" class="text-xs opacity-20"></p></div></aside>
<main class="flex-1"><div class="grid grid-cols-4 gap-6 mb-10"><div class="bg-white/5 p-6 rounded-3xl"><p class="text-xs opacity-40 uppercase">Fleet</p><p class="text-3xl font-bold">18/20</p></div><div class="bg-white/5 p-6 rounded-3xl border-blue-500/20"><p class="text-xs text-blue-400 uppercase">Live</p><p class="text-3xl font-bold">ONLINE</p></div></div><div class="bg-white/5 rounded-[3rem] h-[40vh] flex items-center justify-center text-white/5 uppercase tracking-[1em] text-4xl">Map Feed</div></main>
</div>
<script>function s(n,r){document.getElementById('ls').style.display='none';document.getElementById('md').style.display='flex';document.getElementById('un').innerText=n;document.getElementById('ur').innerText=r;}</script>
</body>
</html>
