<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velloq | Command Center</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap');
        body { background: #080d1f; color: white; font-family: 'Urbanist', sans-serif; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .clay-card { background: rgba(255, 255, 255, 0.03); border-radius: 24px; box-shadow: inset 8px 8px 16px rgba(255,255,255,0.02), inset -8px -8px 16px rgba(0,0,0,0.2), 10px 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255, 255, 255, 0.08); }
        #map { height: 100%; width: 100%; border-radius: 32px; z-index: 1; }
        .dp { transform: translateX(110%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 200; }
        .dp.open { transform: translateX(0); }
        .eye-btn { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); cursor: pointer; opacity: 0.3; }
        .pulse-diag { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex">
    <div id="ls" class="fixed inset-0 z-[300] bg-[#080d1f] flex items-center justify-center p-6"><div class="max-w-md w-full glass p-12 rounded-[3rem] text-center border-white/5"><img src="https://priscadezigns.org/vela/vela_logo.png" class="h-24 mx-auto mb-6 rounded-3xl"><h1 class="text-4xl font-bold uppercase tracking-tighter mb-10">Velloq <span class="opacity-20">Command</span></h1><div class="space-y-4 text-left"><input id="e" placeholder="Email" class="w-full bg-white/5 border border-white/10 rounded-2xl p-5 outline-none focus:border-blue-500"><div class="relative"><input id="p" type="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded-2xl p-5 outline-none focus:border-blue-500"><div onclick="tE('p')" class="eye-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></div></div><button onclick="login()" class="w-full py-5 rounded-2xl bg-blue-600 font-bold text-lg">AUTHENTICATE</button></div></div></div>
    <div id="md" class="hidden flex-1 flex h-screen"><aside class="w-80 glass border-r border-white/5 flex flex-col p-8 space-y-8"><div class="flex items-center gap-4"><img src="https://priscadezigns.org/vela/vela_logo.png" class="h-10"><span class="font-bold tracking-tighter text-2xl uppercase">Velloq</span></div><nav class="flex-1 space-y-2"><button onclick="v('map')" class="w-full p-4 rounded-xl text-left text-xs font-bold opacity-40 hover:opacity-100">Tactical Map</button><button onclick="v('personnel')" class="w-full p-4 rounded-xl text-left text-xs font-bold opacity-40 hover:opacity-100">Personnel (20)</button><button onclick="v('fleet')" class="w-full p-4 rounded-xl text-left text-xs font-bold opacity-40 hover:opacity-100">Diagnostics (5)</button></nav><div class="pt-8 border-t border-white/5"><p id="un" class="font-bold"></p><p id="ur" class="text-[9px] opacity-20 uppercase tracking-widest"></p><button onclick="lo()" class="mt-4 text-red-500/50 uppercase text-[10px] font-bold">Sign Out</button></div></aside>
    <main class="flex-1 p-8 flex flex-col relative overflow-hidden"><header class="flex justify-between items-center mb-8"><h2 id="vt" class="text-3xl font-bold uppercase tracking-tighter">Tactical Map</h2><button id="ac" onclick="oM()" class="hidden px-6 py-3 bg-blue-600 rounded-xl text-[10px] font-bold uppercase">+ Add Asset</button></header><div id="ct" class="flex-1 relative overflow-hidden"><div id="mv" class="h-full w-full"><div id="map"></div></div><div id="tv" class="hidden h-full overflow-y-auto clay-card p-10"></div></div>
    <div id="dp" class="dp fixed top-8 bottom-8 right-8 w-[400px] glass rounded-[3rem] p-10 border-white/10 flex flex-col space-y-8"><div class="flex justify-between items-center"><h3 class="text-xl font-bold uppercase tracking-tighter">Asset Intelligence</h3><button onclick="cDP()" class="opacity-30">✕</button></div><div id="db" class="flex-1 space-y-6 text-center overflow-y-auto"></div></div></main></div>
    <script>
        const users = [{ e: "alice@amber-sim.local", p: "Alice123", n: "Alice", r: "Sovereign" }, { e: "priscillanarine@gmail.com", p: "PRISS123", n: "Priscilla Narine", r: "Sovereign / CTO" }];
        const pData = [{n:"Jason Rivers",r:"Driver",e:"jason.rivers@amber-sim.local",ph:"1-868-555-1479"},{n:"Kelly Smith",r:"Driver",e:"kelly.smith@amber-sim.local",ph:"1-868-555-8546"},{n:"David Low",r:"Driver",e:"david.low@amber-sim.local",ph:"1-868-555-7443"},{n:"Sarah Chen",r:"HR",e:"sarah.chen@amber-sim.local",ph:"1-868-555-1235"},{n:"Mark Bass",r:"Dispatcher",e:"mark.bass@amber-sim.local",ph:"1-868-555-1942"},{n:"Anand Maharaj",r:"Chef",e:"anand.maharaj@amber-sim.local",ph:"1-868-555-2641"},{n:"Priya Khan",r:"Sous Chef",e:"priya.khan@amber-sim.local",ph:"1-868-555-5813"},{n:"Michael Williams",r:"Kitchen",e:"michael.williams@amber-sim.local",ph:"1-868-555-2540"},{n:"Tricia Persad",r:"Kitchen",e:"tricia.persad@amber-sim.local",ph:"1-868-555-8854"},{n:"Ricardo Gomez",r:"Kitchen",e:"ricardo.gomez@amber-sim.local",ph:"1-868-555-1320"},{n:"Leah Ali",r:"Server",e:"leah.ali@amber-sim.local",ph:"1-868-555-2689"},{n:"Dwayne Boodoo",r:"Server",e:"dwayne.boodoo@amber-sim.local",ph:"1-868-555-6024"},{n:"Sasha Ramnarine",r:"Server",e:"sasha.ramnarine@amber-sim.local",ph:"1-868-555-1958"},{n:"Chris John",r:"Server",e:"chris.john@amber-sim.local",ph:"1-868-555-3689"},{n:"Maya Thomas",r:"Server",e:"maya.thomas@amber-sim.local",ph:"1-868-555-1105"},{n:"Kevin Pierre",r:"Cleaner",e:"kevin.pierre@amber-sim.local",ph:"1-868-555-9454"},{n:"Renee Joseph",r:"Cleaner",e:"renee.joseph@amber-sim.local",ph:"1-868-555-8414"},{n:"Justin Lal",r:"Security",e:"justin.lal@amber-sim.local",ph:"1-868-555-6077"},{n:"Shana Seepersad",r:"Security",e:"shana.seepersad@amber-sim.local",ph:"1-868-555-7459"},{n:"Amir Narine",r:"Admin",e:"amir.narine@amber-sim.local",ph:"1-868-555-9507"}];
        const fData = [{p:"PDB 1001",m:"GAC GS4",c:"CHAS-77291-TX",h:98,f:75,s:42,t:195,o:12405},{p:"PDB 1002",m:"GAC GS8",c:"CHAS-88120-RZ",h:100,f:92,s:0,t:180,o:8540},{p:"PDB 1003",m:"GAC Emkoo",c:"CHAS-11029-KL",h:85,f:12,s:65,t:210,o:1520},{p:"PDB 1004",m:"GAC Empow",c:"CHAS-55091-ZX",h:92,f:45,s:12,t:198,o:3200},{p:"PDB 1005",m:"GAC GS3",c:"CHAS-44102-AQ",h:88,f:68,s:35,t:202,o:5800}];
        let map, curU;
        window.onload = () => { const u = JSON.parse(localStorage.getItem('v_adm')); if (u) { s(u); } else { document.getElementById('ls').style.display = 'flex'; } };
        function tE(id){ const i=document.getElementById(id); i.type=i.type==='password'?'text':'password'; }
        function login() { const e=document.getElementById('e').value.trim().toLowerCase(), p=document.getElementById('p').value.trim(), f=users.find(u=>u.e===e && u.p===p); if(f){ localStorage.setItem('v_adm',JSON.stringify(f)); s(f); } else alert('Denied'); }
        function s(u) { curU=u; document.getElementById('ls').style.display='none'; document.getElementById('md').classList.remove('hidden'); document.getElementById('un').innerText=u.n; document.getElementById('ur').innerText=u.r; if(u.r.includes('Sovereign')) document.getElementById('ac').classList.remove('hidden'); initMap(); }
        function initMap() { if(map) return; map=L.map('map',{zoomControl:false}).setView([10.2833,-61.4667],11); L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map); L.marker([10.2833,-61.4667]).addTo(map).bindPopup('<b>Amber HQ</b>'); }
        function v(t) { document.getElementById('vt').innerText=t.toUpperCase(); const mv=document.getElementById('mv'), tv=document.getElementById('tv'); if(t==='map'){ mv.classList.remove('hidden'); tv.classList.add('hidden'); } else { mv.classList.add('hidden'); tv.classList.remove('hidden'); rT(t); } }
        function rT(t) { const tv=document.getElementById('tv'); let h=`<table class="w-full text-left"><thead><tr class="text-[10px] opacity-20 uppercase font-bold tracking-widest"><th class="pb-6">Identity</th><th class="pb-6">Source</th><th class="pb-6">Status</th><th class="pb-6 text-right">Ops</th></tr></thead><tbody class="text-sm">`;
            if(t==='personnel') pData.forEach(p=>h+=`<tr class="border-t border-white/5"><td class="py-5 font-bold">${p.n}</td><td class="opacity-50 text-[10px]">Mobile Link</td><td class="text-green-500 font-bold text-[10px]">LIVE</td><td class="text-right"><button onclick="oDP('p','${p.n}')" class="text-blue-400 font-bold">Intel</button></td></tr>`);
            else if(t==='fleet') fData.forEach(f=>h+=`<tr class="border-t border-white/5"><td class="py-5 font-bold">${f.p}</td><td class="opacity-50 text-[10px] uppercase">Core-${f.p.split(' ')[1]}</td><td><div class="flex items-center gap-2 text-blue-400 font-bold"><span class="w-2 h-2 rounded-full bg-blue-400 pulse-diag"></span> STREAMING</div></td><td class="text-right"><button onclick="oDP('f','${f.p}')" class="text-blue-400 font-bold">Diag</button></td></tr>`);
            tv.innerHTML=h+`</tbody></table>`;
        }
        function oDP(t,n) { const db=document.getElementById('db'), dp=document.getElementById('dp');
            if(t==='p'){ const p=pData.find(x=>x.n===n); db.innerHTML=`<div class="clay-card w-24 h-24 mx-auto mb-6"><img src="https://ui-avatars.com/api/?name=${p.n}&background=2563eb&color=fff" class="rounded-full"></div><p class="text-xl font-bold uppercase tracking-tighter">${p.n}</p><p class="text-[10px] opacity-20 uppercase mb-8">${p.r}</p><div class="text-left space-y-4 px-4"><div class="flex justify-between text-xs opacity-50"><span>Email</span><span>${p.e}</span></div><div class="flex justify-between text-xs opacity-50"><span>Phone</span><span>${p.ph}</span></div></div>`; }
            else { const f=fData.find(x=>x.p===n); db.innerHTML=`<div class="clay-card p-6 mb-6 text-2xl font-bold uppercase tracking-widest text-blue-400 font-mono"><span>${f.p}</span></div><p class="text-xl font-bold uppercase">${f.m}</p><p class="text-[10px] opacity-20 uppercase mb-8">${f.c}</p><div class="grid grid-cols-2 gap-4 px-2 text-left"><div class="clay-card p-4"><p class="text-[8px] opacity-30 uppercase">Engine</p><p class="text-lg font-bold">22.4%</p></div><div class="clay-card p-4"><p class="text-[8px] opacity-30 uppercase">Coolant</p><p class="text-lg font-bold">${f.t}°F</p></div><div class="clay-card p-4"><p class="text-[8px] opacity-30 uppercase">Voltage</p><p class="text-lg font-bold">14.2 V</p></div><div class="clay-card p-4"><p class="text-[8px] opacity-30 uppercase">Odo</p><p class="text-lg font-bold">${f.o} km</p></div></div>`; }
            dp.classList.add('open');
        }
        function cDP() { document.getElementById('dp').classList.remove('open'); }
        function lo() { localStorage.clear(); location.reload(); }
        function oM() { alert('Registration Shield Enabled'); }
    </script>
</body>
</html>
