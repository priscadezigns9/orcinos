<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Velloq | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #080d1f; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-[#080d1f] text-white flex items-center justify-center min-h-screen p-6">
    <div id="login-screen" class="max-w-md w-full space-y-8 glass p-10 rounded-3xl">
        <div class="text-center">
            <img src="https://priscadezigns.org/vela/vela_logo.png" alt="Velloq" class="h-20 w-20 mx-auto mb-4 rounded-2xl shadow-xl shadow-blue-500/20">
            <h1 class="text-4xl font-bold text-blue-500 tracking-tighter">VELLOQ</h1>
            <p class="text-white/40 text-xs uppercase tracking-widest mt-2">Operational Command Center</p>
        </div>
        <div class="space-y-4">
            <input id="email" type="email" placeholder="Authorized Email" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 focus:outline-none focus:border-blue-500">
            <div class="relative">
                <input id="password" type="password" placeholder="Access Token" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 focus:outline-none focus:border-blue-500">
                <button onclick="p=document.getElementById('password');p.type=p.type==='password'?'text':'password'" class="absolute right-4 top-4 text-white/20 hover:text-white/60">👁</button>
            </div>
            <button onclick="l=document.getElementById('email').value.trim();p=document.getElementById('password').value.trim();if(l==='alice@amber-sim.local'&&p==='Alice123'){document.getElementById('login-screen').style.display='none';document.getElementById('dash').style.display='flex';document.getElementById('un').innerText='ALICE (SOVEREIGN)';}else if(l==='amir.narine@amber-sim.local'&&p==='Amir123'){document.getElementById('login-screen').style.display='none';document.getElementById('dash').style.display='flex';document.getElementById('un').innerText='AMIR (ADMIN)';}else{alert('Invalid Credentials');}" class="w-full py-4 rounded-xl bg-blue-600 font-bold tracking-widest hover:bg-blue-500 transition-all">AUTHENTICATE</button>
        </div>
    </div>
    <div id="dash" style="display:none" class="flex-col items-center justify-center text-center">
        <h1 class="text-4xl font-bold text-blue-500 mb-4">ACCESS GRANTED</h1>
        <p class="text-xl">Welcome to the Truth Layer, <span id="un" class="text-white font-bold"></span></p>
    </div>
</body>
</html>
